<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار تحديد الميول البرمجية</title>
  <!-- ملفات الربط الأساسية (نفس المستخدمة في موقعك الرئيسي) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="assets/css/test.css"> <!-- ملف التنسيق الخاص بالاختبار -->
</head>
<body>

  <!-- الناف بار (Navbar) للعودة للرئيسية -->
  <nav class="navbar navbar-expand-lg quiz-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="fa fa-graduation-cap"></i> مسارك البرمجي
      </a>
      <a href="index.html" class="btn back-home-btn">
        <i class="fa fa-home ml-1"></i> العودة للرئيسية
      </a>
    </div>
  </nav>

  <!-- حاوية الاختبار الرئيسية -->
  <section class="quiz-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
          
          <div class="quiz-card">
            <!-- شريط تقدم الاختبار -->
            <div class="quiz-progress-container mb-4">
              <div class="d-flex justify-content-between text-white mb-2">
                <span>السؤال <span id="current-question">1</span> من 10</span>
                <span id="progress-percentage">10%</span>
              </div>
              <div class="progress custom-progress">
                <div class="progress-bar" role="progressbar" style="width: 10%" aria-valuenow="10" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>

            <!-- مكان عرض السؤال -->
            <div class="question-container">
              <h3 class="question-title">ما هو الشيء الذي تجد نفسك مستمتعاً به أكثر أثناء العمل على المشاريع؟</h3>
              
              <!-- خيارات الإجابة -->
              <div class="quiz-options mt-4">
                <label class="option-box">
                  <input type="radio" name="quiz-opt" value="web">
                  <span class="option-text">تصميم واجهات وتنسيق ألوان الصفحات لتكون مريحة للمستخدم.</span>
                </label>
                
                <label class="option-box">
                  <input type="radio" name="quiz-opt" value="ai">
                  <span class="option-text">تحليل البيانات الضخمة وبناء نماذج تتوقع وتفكر بشكل ذكي.</span>
                </label>
                
                <label class="option-box">
                  <input type="radio" name="quiz-opt" value="games">
                  <span class="option-text">بناء عوالم افتراضية، تحريك الشخصيات، ورسم قواعد وقوانين اللعبة.</span>
                </label>
                
                <label class="option-box">
                  <input type="radio" name="quiz-opt" value="cyber">
                  <span class="option-text">البحث عن الثغرات، حماية الأنظمة والبيانات من الاختراقات الهجومية.</span>
                </label>
              </div>
            </div>

            <!-- أزرار التنقل -->
            <div class="quiz-footer-buttons d-flex justify-content-between mt-5">
              <button class="btn nav-quiz-btn" id="prev-btn" disabled>
                <i class="fa fa-angle-right mr-1"></i> السابق
              </button>
              <button class="btn nav-quiz-btn active-next" id="next-btn">
                التالي <i class="fa fa-angle-left ml-1"></i>
              </button>
            </div>

          </div> <!-- نهاية الـ card -->

        </div>
      </div>
    </div>
  </section>

  

</body>
</html>
